name: Export Notebooks

on:
  push:
    branches-ignore: [main]
    paths:
      - "notebooks/*.py"
      - "templates/**"
      - ".github/workflows/export-html.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.filter.outputs.notebooks }}
      notebooks_files: ${{ steps.filter.outputs.notebooks_files }}
      templates: ${{ steps.filter.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            notebooks:
              - 'notebooks/*.py'
            templates:
              - 'templates/**'

  export:
    needs: detect-changes
    if: needs.detect-changes.outputs.notebooks == 'true' || needs.detect-changes.outputs.templates == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e ".[export]" "aperiodic[pandas]"

      - name: Determine which notebooks to export
        id: resolve
        env:
          CHANGED_FILES: ${{ needs.detect-changes.outputs.notebooks_files }}
          TEMPLATES_CHANGED: ${{ needs.detect-changes.outputs.templates }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # If templates changed or manual dispatch, rebuild all notebooks
          if [ "$TEMPLATES_CHANGED" = "true" ] || [ "$IS_DISPATCH" = "true" ]; then
            echo "Rebuilding all notebooks (templates changed or manual dispatch)"
            names=""
            for f in notebooks/*.py; do
              name="$(basename "${f%.py}")"
              names="$names $name"
            done
            echo "names=$names" >> "$GITHUB_OUTPUT"
          else
            # Only rebuild notebooks whose source files changed (skip deletions)
            names=""
            for f in $CHANGED_FILES; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              name="${base%.*}"
              # Deduplicate (both .py and .ipynb may be listed)
              case " $names " in
                *" $name "*) ;;
                *) names="$names $name" ;;
              esac
            done
            echo "names=$names" >> "$GITHUB_OUTPUT"
          fi
          echo "Notebooks to export:$names"

      - name: Inject API key into notebooks
        env:
          APERIODIC_API_KEY: ${{ secrets.APERIODIC_API_KEY }}
        run: |
          for f in notebooks/*.py; do
            sed -i "s|API_KEY = \"...\"|API_KEY = \"${APERIODIC_API_KEY}\"|g" "$f"
          done

      - name: Sync changed .py to .ipynb
        run: |
          for name in ${{ steps.resolve.outputs.names }}; do
            f="notebooks/${name}.py"
            [ -f "$f" ] || continue
            echo "Syncing $f"
            jupytext --update --to ipynb "$f"
          done

      - name: Remove generated files for deleted notebooks
        if: github.event_name == 'push'
        env:
          CHANGED_FILES: ${{ needs.detect-changes.outputs.notebooks_files }}
        run: |
          for f in $CHANGED_FILES; do
            [ -f "$f" ] && continue
            name="$(basename "${f%.py}")"
            ipynb="notebooks/${name}.ipynb"
            html="html/${name}.html"
            if [ -f "$ipynb" ]; then
              echo "Removing $ipynb (source deleted)"
              rm "$ipynb"
            fi
            if [ -f "$html" ]; then
              echo "Removing $html (source deleted)"
              rm "$html"
            fi
          done

      - name: Execute notebooks in place
        run: |
          failed=0
          for name in ${{ steps.resolve.outputs.names }}; do
            nb="notebooks/${name}.ipynb"
            [ -f "$nb" ] || continue
            echo "Executing $name in place"
            if ! jupyter nbconvert \
              --to notebook \
              --inplace \
              --execute \
              --ExecutePreprocessor.timeout=300 \
              --ExecutePreprocessor.kernel_name=python3 \
              "$nb"; then
              echo "ERROR: Failed to execute $name"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more notebook executions failed."
            exit 1
          fi

      - name: Export notebooks to HTML
        run: |
          mkdir -p html
          failed=0
          for name in ${{ steps.resolve.outputs.names }}; do
            nb="notebooks/${name}.ipynb"
            [ -f "$nb" ] || continue
            echo "Exporting $name to HTML"
            if ! jupyter nbconvert \
              --to html \
              --template aperiodic \
              --HTMLExporter.extra_template_basedirs=./templates \
              --output-dir=html \
              --output="$name.html" \
              "$nb"; then
              echo "ERROR: Failed to export $name"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more notebook exports failed."
            exit 1
          fi

      - name: Scrub API key from HTML outputs
        env:
          APERIODIC_API_KEY: ${{ secrets.APERIODIC_API_KEY }}
        run: |
          for f in html/*.html; do
            [ -f "$f" ] || continue
            sed -i "s|${APERIODIC_API_KEY}|...|g" "$f"
          done
          echo "Scrubbed API key from $(ls html/*.html 2>/dev/null | wc -l) file(s)"

      - name: Commit generated notebooks and HTML
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notebooks/*.ipynb html/*.html || true
          git diff --cached --quiet || git commit -m "chore(Export): Sync notebooks and export HTML"
          git stash --include-untracked
          git pull --rebase origin "${{ github.ref_name }}"
          git stash pop || true
          git push
