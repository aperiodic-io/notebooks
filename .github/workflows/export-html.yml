name: Export Notebooks to HTML

on:
  push:
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.filter.outputs.notebooks }}
      notebooks_files: ${{ steps.filter.outputs.notebooks_files }}
      templates: ${{ steps.filter.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            notebooks:
              - 'notebooks/*.py'
              - 'notebooks/*.ipynb'
            templates:
              - 'templates/**'

  export:
    needs: detect-changes
    if: needs.detect-changes.outputs.notebooks == 'true' || needs.detect-changes.outputs.templates == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jupyter nbconvert jupytext "aperiodic[pandas,polars]" pyarrow matplotlib

      - name: Determine which notebooks to export
        id: resolve
        env:
          CHANGED_FILES: ${{ needs.detect-changes.outputs.notebooks_files }}
          TEMPLATES_CHANGED: ${{ needs.detect-changes.outputs.templates }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # If templates changed or manual dispatch, rebuild all notebooks
          if [ "$TEMPLATES_CHANGED" = "true" ] || [ "$IS_DISPATCH" = "true" ]; then
            echo "Rebuilding all notebooks (templates changed or manual dispatch)"
            names=""
            for f in notebooks/*.py; do
              name="$(basename "${f%.py}")"
              names="$names $name"
            done
            echo "names=$names" >> "$GITHUB_OUTPUT"
          else
            # Only rebuild notebooks whose source files changed
            names=""
            for f in $CHANGED_FILES; do
              base="$(basename "$f")"
              name="${base%.*}"
              # Deduplicate (both .py and .ipynb may be listed)
              case " $names " in
                *" $name "*) ;;
                *) names="$names $name" ;;
              esac
            done
            echo "names=$names" >> "$GITHUB_OUTPUT"
          fi
          echo "Notebooks to export:$names"

      - name: Inject API key into notebooks
        env:
          APERIODIC_API_KEY: ${{ secrets.APERIODIC_API_KEY }}
        run: |
          for f in notebooks/*.py; do
            sed -i "s|API_KEY = \"...\"|API_KEY = \"${APERIODIC_API_KEY}\"|g" "$f"
          done

      - name: Sync .py to .ipynb
        run: |
          for f in notebooks/*.py; do
            echo "Syncing $f"
            jupytext --to ipynb "$f"
          done

      - name: Execute and export notebooks to HTML
        run: |
          mkdir -p html
          for name in ${{ steps.resolve.outputs.names }}; do
            nb="notebooks/${name}.ipynb"
            [ -f "$nb" ] || continue
            echo "Executing and exporting $name"
            jupyter nbconvert \
              --to html \
              --execute \
              --ExecutePreprocessor.timeout=300 \
              --ExecutePreprocessor.kernel_name=python3 \
              --template aperiodic \
              --HTMLExporter.extra_template_basedirs=./templates \
              --output-dir=html \
              --output="$name.html" \
              "$nb" || echo "WARNING: Failed to export $name"
          done

      - name: Scrub API key from HTML outputs
        env:
          APERIODIC_API_KEY: ${{ secrets.APERIODIC_API_KEY }}
        run: |
          for f in html/*.html; do
            [ -f "$f" ] || continue
            sed -i "s|${APERIODIC_API_KEY}|...|g" "$f"
          done
          echo "Scrubbed API key from $(ls html/*.html 2>/dev/null | wc -l) file(s)"

      - name: Commit HTML exports
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add html/*.html
          git diff --cached --quiet || git commit -m "chore(Export): Execute and export notebooks to HTML"
          git stash --include-untracked
          git pull --rebase origin "${{ github.ref_name }}"
          git stash pop || true
          git push
