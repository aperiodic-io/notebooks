name: Jupytext Sync

on:
  push:
    paths:
      - "notebooks/*.py"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install jupytext

      - name: Convert .py to .ipynb
        run: |
          for f in notebooks/*.py; do
            echo "Converting $f"
            jupytext --to ipynb "$f"
          done

      - name: Commit .ipynb files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notebooks/*.ipynb
          git diff --cached --quiet || git commit -m "chore: sync .ipynb from .py via jupytext"
          git push
