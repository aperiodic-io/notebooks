name: Jupytext Sync

on:
  push:
    branches-ignore: [main]
    paths:
      - "notebooks/*.py"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install jupytext

      - name: Get changed .py files
        id: changed
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            notebooks:
              - 'notebooks/*.py'

      - name: Convert changed .py to .ipynb
        if: steps.changed.outputs.notebooks == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.notebooks_files }}
        run: |
          for f in $CHANGED_FILES; do
            echo "Converting $f"
            jupytext --update --to ipynb "$f"
          done

      - name: Commit .ipynb files
        if: steps.changed.outputs.notebooks == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notebooks/*.ipynb
          git diff --cached --quiet || git commit -m "chore: sync .ipynb from .py via jupytext"
          git push
