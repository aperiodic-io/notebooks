[project]
name = "aperiodic-notebooks"
version = "0.1.0"
description = "Interactive marimo notebooks for exploring Aperiodic market data APIs."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "marimo",
    "aperiodic[pandas]",
    "pyarrow",
    "matplotlib",
]

[project.optional-dependencies]
quality = ["ruff>=0.14.1"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "E501",
    "PLR2004",
    "PLR0913",
]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "DTZ",
    "ISC",
    "PIE",
    "PT",
    "RET",
    "SIM",
    "PD",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
]
fixable = ["ALL"]
